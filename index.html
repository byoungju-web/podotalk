<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<title>포도톡 · 봇을 부르는 단체방</title>
<meta name="description" content="@봇을 불러서 요약하고 번역하고 퀴즈 만드는 단체 채팅. 설치 없이 바로."/>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#6F2DBD"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<link rel="apple-touch-icon" href="/podotalk-192.png"/>
<link rel="preconnect" href="https://cdn.jsdelivr.net"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/>
<style>
:root{
  --ink:#1E1130; --grape:#6F2DBD; --grape-2:#8B5CF6; --grape-deep:#42177A;
  --lilac:#F1E9FE; --paper:#FCFAFF; --card:#fff; --line:#E9DFF7;
  --muted:#7A6B8C; --ok:#2F9E68; --warn:#C2410C;
  --sh:0 1px 2px rgba(30,17,48,.06), 0 8px 24px rgba(30,17,48,.06);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:var(--font);background:var(--paper);color:var(--ink);
  font-size:15px;line-height:1.5;letter-spacing:-.01em;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--grape-2);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 상단 ── */
header{position:sticky;top:0;z-index:30;background:rgba(252,250,255,.92);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex;align-items:center;gap:10px}
.wordmark{font-weight:800;font-size:21px;letter-spacing:-.04em;color:var(--grape-deep);display:flex;align-items:center;gap:6px}
.wordmark em{font-style:normal;color:var(--grape)}
.hbtn{margin-left:auto;display:flex;gap:6px}
.icobtn{width:38px;height:38px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:17px;box-shadow:var(--sh)}
.icobtn.on{background:var(--grape);border-color:var(--grape);color:#fff}

/* ── 탭 ── */
.tabs{display:flex;gap:7px;padding:12px 16px 4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:8px 15px;border-radius:999px;background:var(--card);
  border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* ── 방 목록 ── */
main{padding:8px 16px calc(120px + var(--safe-b))}
.room{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:14px 16px;margin-bottom:9px;display:flex;gap:13px;align-items:flex-start;box-shadow:var(--sh)}
.room:active{transform:scale(.99)}
.rem{width:42px;height:42px;flex:0 0 auto;border-radius:14px;background:var(--lilac);
  display:grid;place-items:center;font-size:21px}
.rbody{min-width:0;flex:1}
.rtop{display:flex;align-items:baseline;gap:7px}
.rname{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtime{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.rlast{font-size:13.5px;color:var(--muted);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.rmeta{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:7px;background:var(--lilac);color:var(--grape-deep)}
.chip.paid{background:#FFF1DC;color:#9A5B00}
.empty{text-align:center;padding:60px 24px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .go{margin-top:16px;display:inline-block;background:var(--grape);color:#fff;font-weight:700;
  padding:11px 20px;border-radius:14px}

/* ── 새 방 버튼 ── */
.fab{position:fixed;right:16px;bottom:calc(20px + var(--safe-b));z-index:25;
  background:var(--grape);color:#fff;height:52px;padding:0 20px;border-radius:26px;font-weight:700;font-size:15px;
  display:flex;align-items:center;gap:7px;box-shadow:0 6px 20px rgba(111,45,189,.38)}

/* ── 채팅 ── */
#chat{position:fixed;inset:0;z-index:40;background:var(--paper);display:none;flex-direction:column}
#chat.on{display:flex}
.chead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;
  background:var(--card);border-bottom:1px solid var(--line)}
.chead .t{min-width:0}
.chead .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chead .t small{color:var(--muted);font-size:12px}
.feed{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 8px;display:flex;flex-direction:column;gap:11px}
.day{align-self:center;font-size:11.5px;color:var(--muted);background:var(--lilac);padding:4px 12px;border-radius:999px}
.line{display:flex;flex-direction:column;max-width:82%}
.line.me{align-self:flex-end;align-items:flex-end}
.line.you{align-self:flex-start}
.who{font-size:11.5px;color:var(--muted);margin:0 4px 3px}
.bub{padding:9px 13px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.me .bub{background:var(--grape);color:#fff;border-bottom-right-radius:5px}
.you .bub{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub a{color:inherit;text-decoration:underline}
.at{color:var(--grape-2);font-weight:700}
.me .at{color:#E9D9FF}
.stamp{font-size:10.5px;color:var(--muted);margin:3px 4px 0}

/* ── 봇 카드: 이 화면의 주인공 ── */
.botcard{align-self:stretch;max-width:100%;background:var(--card);border:1px solid var(--line);
  border-left:3px solid var(--grape);border-radius:6px 16px 16px 6px;overflow:hidden;box-shadow:var(--sh);
  animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.bothead{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,var(--lilac),transparent)}
.bothead .tag{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--grape-deep)}
.bothead .lbl{margin-left:auto;font-size:11px;color:var(--muted)}
.botbody{padding:12px 14px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.botcard.wait .botbody{color:var(--muted)}
.dots span{display:inline-block;width:5px;height:5px;margin-right:3px;border-radius:50%;background:var(--grape-2);
  animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ── 입력 ── */
.composer{position:relative;background:var(--card);border-top:1px solid var(--line);
  padding:9px 12px calc(9px + var(--safe-b))}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow textarea{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:20px;
  padding:10px 14px;resize:none;max-height:120px;font-size:15px;outline:none}
.crow textarea:focus{border-color:var(--grape-2);background:#fff}
.send{width:44px;height:44px;flex:0 0 auto;border-radius:22px;background:var(--grape);color:#fff;font-size:18px;
  display:grid;place-items:center}
.send:disabled{opacity:.35}
.mentions{position:absolute;left:12px;right:12px;bottom:calc(100% - 2px);background:var(--card);
  border:1px solid var(--line);border-radius:16px;box-shadow:0 -6px 28px rgba(30,17,48,.14);
  overflow:hidden;display:none;max-height:230px;overflow-y:auto}
.mentions.on{display:block}
.mentions .h{padding:8px 14px;font-size:11.5px;color:var(--muted);background:var(--lilac)}
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{font-size:18px}
.mrow b{font-family:var(--mono);font-size:13.5px;color:var(--grape-deep)}
.mrow small{display:block;color:var(--muted);font-size:12px}

/* ── 시트 ── */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(30,17,48,.42);display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);
  border-radius:22px 22px 0 0;padding:8px 20px calc(24px + var(--safe-b));
  transform:translateY(100%);transition:transform .24s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto}
.sheet.on{transform:none}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 14px}
.sheet h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.sheet p.sub{margin:0 0 18px;color:var(--muted);font-size:13.5px}
label.f{display:block;margin-bottom:14px}
label.f span{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:13px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--grape-2);background:#fff}
.seg{display:flex;gap:7px}
.seg button{flex:1;padding:11px 0;border-radius:13px;border:1px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--lilac);border-color:var(--grape-2);color:var(--grape-deep)}
.primary{width:100%;background:var(--grape);color:#fff;font-weight:700;padding:14px;border-radius:15px;font-size:15.5px;margin-top:6px}
.ghost{width:100%;background:var(--paper);border:1px solid var(--line);color:var(--muted);font-weight:600;padding:12px;border-radius:14px;margin-top:8px}
.danger{color:var(--warn)}
.toggle{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.toggle b{font-size:14.5px}.toggle small{display:block;color:var(--muted);font-size:12.5px}
.toggle .sw{margin-left:auto;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:.2s;box-shadow:var(--sh)}
.toggle .sw[aria-pressed="true"]{background:var(--ok)}
.toggle .sw[aria-pressed="true"]::after{left:23px}
.task{display:flex;gap:11px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.task .box{width:22px;height:22px;flex:0 0 auto;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px}
.task.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done b{text-decoration:line-through;color:var(--muted)}
.task small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(8px);
  z-index:60;background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;
  opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="wordmark">🍇 포도<em>톡</em></div>
  <div class="hbtn">
    <button class="icobtn" id="btnInstall" hidden aria-label="앱 설치">↓</button>
    <button class="icobtn" id="btnCode" aria-label="코드로 입장">#</button>
    <button class="icobtn" id="btnSettings" aria-label="설정">☰</button>
  </div>
</header>

<div class="tabs" role="tablist" id="tabs">
  <button class="tab" role="tab" data-type="mine" aria-selected="true">내 방</button>
  <button class="tab" role="tab" data-type="general" aria-selected="false">일반</button>
  <button class="tab" role="tab" data-type="study" aria-selected="false">스터디</button>
  <button class="tab" role="tab" data-type="creator" aria-selected="false">크리에이터</button>
  <button class="tab" role="tab" data-type="store" aria-selected="false">가게</button>
</div>

<main id="list"></main>
<button class="fab" id="btnNew">＋ 방 만들기</button>

<!-- 채팅 -->
<section id="chat" aria-hidden="true">
  <div class="chead">
    <button class="icobtn" id="btnBack" aria-label="뒤로">←</button>
    <div class="t"><b id="cTitle"></b><small id="cSub"></small></div>
    <button class="icobtn" id="btnTasks" style="margin-left:auto" hidden aria-label="과제">✓</button>
    <button class="icobtn" id="btnRoomMenu" aria-label="방 설정">⋯</button>
  </div>
  <div class="feed" id="feed"></div>
  <div class="composer">
    <div class="mentions" id="mentions"></div>
    <div class="crow">
      <textarea id="input" rows="1" placeholder="메시지 입력 · @로 봇 부르기"></textarea>
      <button class="send" id="btnSend" aria-label="보내기">↑</button>
    </div>
  </div>
</section>

<div class="scrim" id="scrim"></div>

<!-- 방 만들기 -->
<section class="sheet" id="sheetNew" aria-hidden="true">
  <div class="grab"></div>
  <h2>새 방 만들기</h2>
  <p class="sub">방을 만들면 초대 코드가 함께 생깁니다.</p>
  <label class="f"><span>방 이름</span><input class="inp" id="nName" maxlength="40" placeholder="예: 부산 사장님 모임"/></label>
  <label class="f"><span>한 줄 소개 (선택)</span><input class="inp" id="nIntro" maxlength="120" placeholder="무슨 얘기를 하는 방인가요"/></label>
  <label class="f"><span>종류</span>
    <div class="seg" id="nType">
      <button data-v="general" aria-pressed="true">일반</button>
      <button data-v="study" aria-pressed="false">스터디</button>
      <button data-v="creator" aria-pressed="false">크리에이터</button>
    </div>
  </label>
  <div class="toggle"><div><b>코드로만 입장</b><small>목록에 안 보이고 코드를 아는 사람만 들어옵니다</small></div>
    <button class="sw" id="nPrivate" aria-pressed="false" aria-label="비공개"></button></div>
  <button class="primary" id="nCreate">방 만들기</button>
</section>

<!-- 설정 -->
<section class="sheet" id="sheetSet" aria-hidden="true">
  <div class="grab"></div>
  <h2>설정</h2>
  <p class="sub" id="setUid"></p>
  <label class="f"><span>대화명</span><input class="inp" id="sNick" maxlength="20"/></label>
  <div class="toggle"><div><b>알림 받기</b><small>새 메시지와 봇 답변을 알려줍니다</small></div>
    <button class="sw" id="sPush" aria-pressed="false" aria-label="알림"></button></div>
  <label class="f" style="margin-top:14px"><span>API 주소</span><input class="inp" id="sApi" placeholder="https://..."/></label>
  <button class="primary" id="sSave">저장</button>
  <button class="ghost" id="sTest">알림 테스트 보내기</button>
</section>

<!-- 방 설정 -->
<section class="sheet" id="sheetRoom" aria-hidden="true">
  <div class="grab"></div>
  <h2 id="rTitle">방 설정</h2>
  <p class="sub" id="rSub"></p>
  <button class="ghost" id="rCopy">초대 코드 복사</button>
  <button class="ghost" id="rBot" hidden>이 방 전용 봇 만들기</button>
  <button class="ghost danger" id="rLeave">방 나가기</button>
  <button class="ghost danger" id="rDelete" hidden>방 삭제하기</button>
</section>

<!-- 과제 -->
<section class="sheet" id="sheetTask" aria-hidden="true">
  <div class="grab"></div>
  <h2>과제</h2>
  <p class="sub">스터디방 참여자 모두가 체크할 수 있습니다.</p>
  <div id="taskList"></div>
  <label class="f" style="margin-top:16px"><span>새 과제</span><input class="inp" id="tTitle" maxlength="100" placeholder="예: 3과 단어 외우기"/></label>
  <button class="primary" id="tAdd">과제 추가</button>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ═══ 기본 설정 ═══ */
const DEFAULT_API = "https://podotalk-api.hasin7jk.workers.dev";
const S = {
  api: localStorage.getItem("pt_api") || DEFAULT_API,
  uid: localStorage.getItem("pt_uid") || "",
  nick: localStorage.getItem("pt_nick") || "",
  room: null, token: null, bots: [], lastTs: 0, timer: null, type: "mine", pending: 0
};
if (!S.uid) { S.uid = "u" + crypto.randomUUID().replace(/-/g, ""); localStorage.setItem("pt_uid", S.uid); }
const tokens = () => { try { return JSON.parse(localStorage.getItem("pt_tokens") || "{}"); } catch { return {}; } };
const saveToken = (id, t) => { const o = tokens(); o[id] = t; localStorage.setItem("pt_tokens", JSON.stringify(o)); };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function rich(s) {
  return esc(s)
    .replace(/(https?:\/\/[^\s&]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])@([a-z0-9_-]{2,24})/gi, '$1<span class="at">@$2</span>');
}
let toastT;
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2400); }

async function api(path, opts = {}) {
  const h = { "Content-Type": "application/json" };
  if (opts.token) h.Authorization = "Bearer " + opts.token;
  try {
    const r = await fetch(S.api + path, { method: opts.body ? "POST" : "GET", headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
    const j = await r.json();
    if (!j.ok && j.error) return j;
    return j;
  } catch { return { ok: false, error: "서버에 연결하지 못했습니다. 잠시 후 다시 시도해 주세요." }; }
}

/* ═══ 시트 ═══ */
let openSheet = null;
function sheet(id) {
  if (openSheet) openSheet.classList.remove("on");
  if (!id) { $("scrim").classList.remove("on"); openSheet = null; return; }
  openSheet = $(id); openSheet.classList.add("on"); $("scrim").classList.add("on");
}
$("scrim").onclick = () => sheet(null);

/* ═══ 방 목록 ═══ */
function when(ts) {
  if (!ts) return "";
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  const days = Math.round((n - d) / 86400000);
  if (days < 7) return days + "일 전";
  return `${d.getMonth() + 1}.${d.getDate()}`;
}
async function loadList(type) {
  S.type = type;
  const el = $("list");
  el.innerHTML = '<div class="empty">불러오는 중…</div>';
  const d = type === "store" ? await api("/stores")
    : await api(`/talk/rooms?type=${type}${type === "mine" ? "&uid=" + S.uid : ""}`);
  const items = d.rooms || d.stores || [];
  if (!items.length) {
    el.innerHTML = type === "mine"
      ? `<div class="empty"><b>아직 들어간 방이 없습니다</b>일반 탭에서 방을 둘러보거나, 새로 만들어 보세요.<br/><button class="go" onclick="document.getElementById('btnNew').click()">방 만들기</button></div>`
      : type === "store"
      ? `<div class="empty"><b>등록된 가게가 없습니다</b>포도다에 가게가 등록되면 여기에 나타납니다.</div>`
      : `<div class="empty"><b>이 분류에 방이 없습니다</b>첫 번째 방을 만들어 보세요.</div>`;
    return;
  }
  el.innerHTML = items.map((r) => {
    const store = type === "store";
    const id = store ? r.slug : r.id;
    const last = store ? `${r.cat || ""} ${r.area || ""}`.trim() : (r.last_body ? `${r.last_nick ? r.last_nick + ": " : ""}${r.last_body}` : (r.intro || "아직 메시지가 없습니다"));
    return `<button class="room" data-id="${esc(id)}" data-store="${store ? 1 : 0}">
      <div class="rem">${esc(r.emoji || (store ? "🏪" : "🍇"))}</div>
      <div class="rbody">
        <div class="rtop"><span class="rname">${esc(r.name)}</span><span class="rtime">${store ? "" : when(r.last_ts)}</span></div>
        <div class="rlast">${esc(last)}</div>
        <div class="rmeta">
          ${store ? `<span class="chip">메뉴 ${r.menus || 0}</span>` : `<span class="chip">${({ general: "일반", study: "스터디", creator: "크리에이터" })[r.type] || r.type}</span><span class="chip">${r.members || 1}명</span>`}
          ${!store && r.is_paid ? `<span class="chip paid">월 ${Number(r.price).toLocaleString()}원</span>` : ""}
        </div>
      </div>
    </button>`;
  }).join("");
}
$("list").addEventListener("click", (e) => {
  const b = e.target.closest(".room"); if (!b) return;
  if (b.dataset.store === "1") { location.href = "https://pododa.kr/#/" + b.dataset.id; return; }
  enterRoom(b.dataset.id);
});
$("tabs").addEventListener("click", (e) => {
  const t = e.target.closest(".tab"); if (!t) return;
  document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x === t));
  loadList(t.dataset.type);
});

/* ═══ 채팅 ═══ */
async function enterRoom(id) {
  const d = await api("/talk/room?id=" + encodeURIComponent(id));
  if (!d.ok) return toast(d.error || "방을 열지 못했습니다");
  S.room = d.room; S.token = tokens()[id] || null; S.lastTs = 0; S.pending = 0;
  $("cTitle").textContent = d.room.name;
  $("cSub").textContent = `${d.room.members || 1}명 · 코드 ${d.room.code || "-"}`;
  $("btnTasks").hidden = d.room.type !== "study";
  $("chat").classList.add("on"); $("chat").setAttribute("aria-hidden", "false");
  $("feed").innerHTML = "";
  location.hash = "#/talk/" + id;
  await api("/talk/room/join", { body: { room_id: id, uid: S.uid, nick: S.nick || "익명" } });
  await loadBots(id);
  await poll(true);
  startPoll();
}
function leaveView() {
  stopPoll(); S.room = null;
  $("chat").classList.remove("on"); $("chat").setAttribute("aria-hidden", "true");
  if (location.hash) history.replaceState(null, "", location.pathname);
  loadList(S.type);
}
$("btnBack").onclick = leaveView;

async function loadBots(id) {
  const d = await api("/mcp/servers?room_id=" + encodeURIComponent(id));
  S.bots = d.servers || [];
}
function bubble(m) {
  const mine = m.uid === S.uid;
  const t = new Date(m.created).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" });
  if (m.kind === "bot") {
    let icon = "🤖"; try { icon = (JSON.parse(m.meta || "{}").icon) || "🤖"; } catch {}
    return `<div class="botcard"><div class="bothead"><span>${esc(icon)}</span><span class="tag">@${esc(m.nick)}</span><span class="lbl">${t}</span></div><div class="botbody">${rich(m.body)}</div></div>`;
  }
  return `<div class="line ${mine ? "me" : "you"}">
    ${mine ? "" : `<div class="who">${esc(m.nick || "익명")}</div>`}
    <div class="bub">${rich(m.body)}</div><div class="stamp">${t}</div></div>`;
}
function append(html) {
  const f = $("feed");
  const stick = f.scrollHeight - f.scrollTop - f.clientHeight < 120;
  f.insertAdjacentHTML("beforeend", html);
  if (stick) f.scrollTop = f.scrollHeight;
}
async function poll(first) {
  if (!S.room) return;
  const d = await api(`/talk/messages?room_id=${encodeURIComponent(S.room.id)}${S.lastTs ? "&after=" + S.lastTs : ""}`);
  if (!d.ok) return;
  const list = d.messages || [];
  if (first && !list.length) {
    $("feed").innerHTML = `<div class="empty" style="margin:auto"><b>첫 메시지를 남겨보세요</b>@summary, @translate 처럼 봇을 부르면 답을 해줍니다.</div>`;
  }
  if (list.length && first) $("feed").innerHTML = "";
  for (const m of list) {
    if (m.kind === "bot") document.querySelector(".botcard.wait")?.remove();
    if (m.uid === S.uid && m.kind === "user" && document.getElementById("tmp-" + m.id)) continue;
    append(bubble(m));
    S.lastTs = Math.max(S.lastTs, m.created);
  }
  if (first) $("feed").scrollTop = $("feed").scrollHeight;
}
function startPoll() { stopPoll(); S.timer = setInterval(() => { if (!document.hidden) poll(false); }, 3000); }
function stopPoll() { clearInterval(S.timer); S.timer = null; }
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.room) poll(false); });

const inp = $("input");
inp.addEventListener("input", () => {
  inp.style.height = "auto"; inp.style.height = Math.min(120, inp.scrollHeight) + "px";
  const m = inp.value.slice(0, inp.selectionStart).match(/(?:^|[\s(])@([a-z0-9_-]*)$/i);
  const box = $("mentions");
  if (!m) return box.classList.remove("on");
  const q = (m[1] || "").toLowerCase();
  const hit = S.bots.filter((b) => b.name.includes(q)).slice(0, 6);
  if (!hit.length) return box.classList.remove("on");
  box.innerHTML = `<div class="h">부를 봇을 고르세요</div>` + hit.map((b) =>
    `<button class="mrow" data-n="${esc(b.name)}"><span class="ic">${esc(b.icon || "🤖")}</span><span><b>@${esc(b.name)}</b><small>${esc(b.descr || "")}</small></span></button>`).join("");
  box.classList.add("on");
});
$("mentions").addEventListener("click", (e) => {
  const b = e.target.closest(".mrow"); if (!b) return;
  inp.value = inp.value.replace(/@[a-z0-9_-]*$/i, "@" + b.dataset.n + " ");
  $("mentions").classList.remove("on"); inp.focus();
});
inp.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && window.matchMedia("(min-width:768px)").matches) { e.preventDefault(); send(); }
});
$("btnSend").onclick = send;

async function send() {
  const text = inp.value.trim();
  if (!text || !S.room) return;
  inp.value = ""; inp.style.height = "auto"; $("mentions").classList.remove("on");
  const tmp = "t" + Date.now();
  append(`<div class="line me" id="tmp-${tmp}"><div class="bub">${rich(text)}</div><div class="stamp">보내는 중…</div></div>`);
  $("feed").scrollTop = $("feed").scrollHeight;
  const d = await api("/talk/message", { body: { room_id: S.room.id, uid: S.uid, nick: S.nick || "익명", body: text } });
  const el = $("tmp-" + tmp);
  if (!d.ok) { if (el) el.querySelector(".stamp").textContent = "실패 · " + (d.error || ""); return; }
  if (el) { el.id = ""; el.querySelector(".stamp").textContent = new Date(d.created).toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit" }); }
  S.lastTs = Math.max(S.lastTs, d.created);
  if (d.bots && d.bots.length) {
    append(`<div class="botcard wait"><div class="bothead"><span>🤖</span><span class="tag">@${esc(d.bots.join(", @"))}</span><span class="lbl">답하는 중</span></div><div class="botbody"><span class="dots"><span></span><span></span><span></span></span> 생각하고 있습니다</div></div>`);
    $("feed").scrollTop = $("feed").scrollHeight;
    chaseBot();
  }
}
/* 봇 답이 저장되는 즉시 잡아내려고 처음엔 촘촘히, 점점 느리게 확인한다 */
function chaseBot() {
  const gaps = [700, 900, 1200, 1600, 2000, 2500, 3000, 4000, 5000];
  let i = 0;
  const tick = async () => {
    if (!S.room || i >= gaps.length) return;
    await poll(false);
    if (!document.querySelector(".botcard.wait")) return;
    setTimeout(tick, gaps[i++]);
  };
  setTimeout(tick, gaps[i++]);
}

/* ═══ 방 만들기 ═══ */
$("btnNew").onclick = () => { $("nName").value = ""; $("nIntro").value = ""; sheet("sheetNew"); setTimeout(() => $("nName").focus(), 250); };
$("nType").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  [...$("nType").children].forEach((x) => x.setAttribute("aria-pressed", x === b));
});
$("nPrivate").onclick = (e) => e.currentTarget.setAttribute("aria-pressed", e.currentTarget.getAttribute("aria-pressed") !== "true");
$("nCreate").onclick = async () => {
  const name = $("nName").value.trim();
  if (!name) return toast("방 이름을 입력해 주세요");
  const type = $("nType").querySelector('[aria-pressed="true"]').dataset.v;
  const d = await api("/talk/room/create", { body: {
    name, intro: $("nIntro").value.trim(), type, uid: S.uid, nick: S.nick || "익명",
    is_private: $("nPrivate").getAttribute("aria-pressed") === "true" ? 1 : 0,
    emoji: { general: "🍇", study: "📚", creator: "✨" }[type]
  }});
  if (!d.ok) return toast(d.error || "방을 만들지 못했습니다");
  saveToken(d.id, d.token);
  sheet(null); toast("방을 만들었습니다");
  enterRoom(d.id);
};

/* ═══ 코드 입장 ═══ */
$("btnCode").onclick = async () => {
  const c = prompt("초대 코드 6자리를 입력하세요");
  if (!c) return;
  const d = await api("/talk/room?code=" + encodeURIComponent(c.trim().toUpperCase()));
  if (!d.ok) return toast("코드에 맞는 방이 없습니다");
  enterRoom(d.room.id);
};

/* ═══ 방 설정 ═══ */
$("btnRoomMenu").onclick = () => {
  if (!S.room) return;
  $("rTitle").textContent = S.room.name;
  $("rSub").textContent = `초대 코드 ${S.room.code} · ${S.room.members || 1}명 참여 중`;
  const owner = S.room.owner_uid === S.uid;
  $("rDelete").hidden = !owner; $("rBot").hidden = !owner;
  sheet("sheetRoom");
};
$("rCopy").onclick = async () => {
  try { await navigator.clipboard.writeText(S.room.code); toast("초대 코드를 복사했습니다"); }
  catch { toast("코드: " + S.room.code); }
};
$("rLeave").onclick = async () => {
  await api("/talk/room/leave", { body: { room_id: S.room.id, uid: S.uid } });
  sheet(null); leaveView(); toast("방에서 나왔습니다");
};
$("rDelete").onclick = async () => {
  if (!confirm("방과 모든 대화가 지워집니다. 삭제할까요?")) return;
  const d = await api("/talk/room/delete", { body: { room_id: S.room.id }, token: S.token });
  if (!d.ok) return toast(d.error || "삭제하지 못했습니다");
  sheet(null); leaveView(); toast("방을 삭제했습니다");
};
$("rBot").onclick = async () => {
  const name = prompt("봇 이름을 영문 소문자로 입력하세요 (예: coach)");
  if (!name) return;
  const p = prompt("이 봇은 어떤 역할인가요?\n예: 너는 헬스 코치다. 짧고 단호하게 답한다.");
  if (!p) return;
  const d = await api("/talk/agent/create", { body: { room_id: S.room.id, name: name.toLowerCase(), prompt: p }, token: S.token });
  if (!d.ok) return toast(d.error || "봇을 만들지 못했습니다");
  await loadBots(S.room.id); sheet(null); toast(`@${name.toLowerCase()} 봇을 만들었습니다`);
};

/* ═══ 과제 ═══ */
$("btnTasks").onclick = async () => { await drawTasks(); sheet("sheetTask"); };
async function drawTasks() {
  const d = await api("/study/tasks?room_id=" + encodeURIComponent(S.room.id));
  const el = $("taskList"), list = d.tasks || [];
  el.innerHTML = list.length ? list.map((t) => `<button class="task ${t.done ? "done" : ""}" data-id="${esc(t.id)}">
    <span class="box">${t.done ? "✓" : ""}</span>
    <span><b>${esc(t.title)}</b><small>${new Date(t.due).toLocaleDateString("ko-KR")}까지${t.done_by ? " · " + esc(t.done_by) : ""}</small></span></button>`).join("")
    : `<div class="empty" style="padding:24px 0">등록된 과제가 없습니다.</div>`;
}
$("taskList").addEventListener("click", async (e) => {
  const b = e.target.closest(".task"); if (!b) return;
  await api("/study/task/toggle", { body: { id: b.dataset.id, nick: S.nick || "익명" } });
  drawTasks();
});
$("tAdd").onclick = async () => {
  const t = $("tTitle").value.trim(); if (!t) return toast("과제 내용을 입력해 주세요");
  await api("/study/task/create", { body: { room_id: S.room.id, title: t } });
  $("tTitle").value = ""; drawTasks(); toast("과제를 추가했습니다");
};

/* ═══ 설정 · 알림 ═══ */
$("btnSettings").onclick = async () => {
  $("sNick").value = S.nick; $("sApi").value = S.api;
  $("setUid").textContent = "기기 ID " + S.uid.slice(1, 9);
  const reg = await navigator.serviceWorker?.getRegistration();
  const sub = await reg?.pushManager.getSubscription();
  $("sPush").setAttribute("aria-pressed", !!sub);
  sheet("sheetSet");
};
$("sSave").onclick = () => {
  S.nick = $("sNick").value.trim().slice(0, 20) || "익명";
  S.api = $("sApi").value.trim() || DEFAULT_API;
  localStorage.setItem("pt_nick", S.nick); localStorage.setItem("pt_api", S.api);
  sheet(null); toast("저장했습니다");
};
$("sPush").onclick = async (e) => {
  const on = e.currentTarget.getAttribute("aria-pressed") === "true";
  const reg = await navigator.serviceWorker.ready;
  if (on) {
    const sub = await reg.pushManager.getSubscription();
    if (sub) { await api("/push/unsubscribe", { body: { endpoint: sub.endpoint } }); await sub.unsubscribe(); }
    e.currentTarget.setAttribute("aria-pressed", "false"); toast("알림을 껐습니다"); return;
  }
  if (await Notification.requestPermission() !== "granted") return toast("기기 설정에서 알림을 허용해 주세요");
  const k = await api("/push/key");
  if (!k.key) return toast("서버에 알림 키가 설정되어 있지 않습니다");
  try {
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToArr(k.key) });
    const r = await api("/push/subscribe", { body: { uid: S.uid, sub: sub.toJSON() } });
    if (!r.ok) return toast(r.error);
    e.currentTarget.setAttribute("aria-pressed", "true"); toast("알림을 켰습니다");
  } catch { toast("알림 등록에 실패했습니다"); }
};
$("sTest").onclick = async () => { const d = await api("/push/test", { body: { uid: S.uid } }); toast(d.ok ? "테스트 알림을 보냈습니다" : d.error); };
function b64uToArr(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/"); s += "=".repeat((4 - s.length % 4) % 4);
  const raw = atob(s), out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

/* ═══ 설치 · SW ═══ */
let installEvt;
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; $("btnInstall").hidden = false; });
$("btnInstall").onclick = async () => { if (!installEvt) return; installEvt.prompt(); installEvt = null; $("btnInstall").hidden = true; };
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js");
  navigator.serviceWorker.addEventListener("message", (e) => { if (e.data?.type === "OPEN_ROOM" && e.data.room_id) enterRoom(e.data.room_id); });
}

/* ═══ 시작 ═══ */
(async function boot() {
  if (!S.nick) {
    const n = prompt("대화명을 정해주세요", "포도" + Math.floor(Math.random() * 900 + 100));
    S.nick = (n || "익명").slice(0, 20); localStorage.setItem("pt_nick", S.nick);
  }
  const share = new URLSearchParams(location.search);
  const m = location.hash.match(/#\/talk\/([\w-]+)/);
  const type = share.get("type");
  if (type) { document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", x.dataset.type === type)); }
  await loadList(type || "mine");
  if (m) enterRoom(m[1]);
})();
</script>
